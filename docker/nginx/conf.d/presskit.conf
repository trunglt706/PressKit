server {
    listen 80;
    listen [::]:80;
    server_name presskit.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name presskit.internal;
    resolver 127.0.0.11 ipv6=off valid=10s;

    root /var/www/html/public;
    index index.php index.html;

    ssl_certificate /etc/nginx/ssl/presskit.internal.crt;
    ssl_certificate_key /etc/nginx/ssl/presskit.internal.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    charset utf-8;

    location ^~ /storage/ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf|otf|eot)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
    }

    location ~* \.(?:css|js|mjs)$ {
        try_files $uri =404;
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ \.php$ {
        set $upstream_php app:9000;
        include fastcgi_params;
        fastcgi_pass $upstream_php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
